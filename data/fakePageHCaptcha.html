<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hCaptcha Verification</title>
    <style>
        body {
            margin: 0;
            padding: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #hcaptcha-wrapper {
            padding: 8px;
            margin: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="hcaptcha-wrapper">
        <div id="hcaptcha-container"></div>
    </div>
    <script src="https://js.hcaptcha.com/1/api.js?onload=onHcaptchaLoad&render=explicit" async defer></script>
    <script>
        window.onHcaptchaLoad = function () {
            var params = {
                sitekey: '<site-key>',
                callback: function (token) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'h-captcha-response';
                    input.value = token;
                    document.body.appendChild(input);

                    var gInput = document.createElement('input');
                    gInput.type = 'hidden';
                    gInput.name = 'g-recaptcha-response';
                    gInput.value = token;
                    document.body.appendChild(gInput);
                },
                'expired-callback': function () {
                    console.log('hCaptcha expired');
                },
                'error-callback': function (err) {
                    console.error('hCaptcha error:', err);
                    var errInput = document.createElement('input');
                    errInput.type = 'hidden';
                    errInput.name = 'h-captcha-error';
                    errInput.value = typeof err === 'string' ? err : JSON.stringify(err);
                    document.body.appendChild(errInput);
                }
            };

            var rqdata = '<rq-data>';
            if (rqdata && rqdata !== '<rq-data>') {
                params['rqdata'] = rqdata;
            }

            try {
                window.widgetId = hcaptcha.render('hcaptcha-container', params);
            } catch (e) {
                console.error("hCaptcha render failed:", e);
            }
        };
    </script>
</body>
</html>
